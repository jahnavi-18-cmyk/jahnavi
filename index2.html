
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Binomial Statistics Calculator</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f6f9;
      color: #222;
      padding: 25px;
    }

    .container {
      max-width: 800px;
      margin: 20px auto;
      background: white;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 3px 12px #00000018;
    }

    h1, h2 {
      color: #234779;
    }

    label {
      display: block;
      margin-top: 15px;
      margin-bottom: 7px;
      font-weight: bold;
    }

    input {
      width: 100%;
      box-sizing: border-box;
      padding: 11px;
      font-size: 16px;
      border: 1px solid #aaa;
      border-radius: 6px;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 15px;
      margin-top: 25px;
    }

    .card {
      background: #eef3fb;
      border-left: 5px solid #2457a7;
      padding: 18px;
      border-radius: 8px;
    }

    .card h3 {
      margin-top: 0;
      font-size: 16px;
    }

    .value {
      font-size: 24px;
      font-weight: bold;
      color: #2457a7;
      overflow-wrap: anywhere;
    }

    #error {
      color: #b3261e;
      font-weight: bold;
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>Binomial Statistics Calculator</h1>

    <p>
      Enter the number of trials and probability of success
      to calculate the statistical measures.
    </p>

    <label for="n">Number of trials (n)</label>
    <input type="number" id="n" min="1" step="1" value="20">

    <label for="p">Probability of success (p)</label>
    <input type="number" id="p" min="0" max="1"
           step="any" value="0.35">

    <p id="error" role="alert"></p>

    <h2>Statistical Results</h2>

    <div class="cards">
      <div class="card">
        <h3>Mean</h3>
        <div class="value" id="mean">—</div>
        <p>np</p>
      </div>

      <div class="card">
        <h3>Variance</h3>
        <div class="value" id="variance">—</div>
        <p>np(1 − p)</p>
      </div>

      <div class="card">
        <h3>Standard Deviation</h3>
        <div class="value" id="sd">—</div>
        <p>√Variance</p>
      </div>

      <div class="card">
        <h3>Second Moment E[X²]</h3>
        <div class="value" id="secondMoment">—</div>
        <p>Variance + Mean²</p>
      </div>

      <div class="card">
        <h3>Skewness</h3>
        <div class="value" id="skewness">—</div>
        <p>(1 − 2p) / √(np(1 − p))</p>
      </div>
    </div>
  </div>

  <script>
    function calculateStatistics() {
      const nText = document.getElementById("n").value.trim();
      const pText = document.getElementById("p").value.trim();

      const n = Number(nText);
      const p = Number(pText);
      const error = document.getElementById("error");

      if (nText === "" || !Number.isInteger(n) || n < 1) {
        error.textContent = "n must be a positive integer.";
        clearResults();
        return;
      }

      if (pText === "" || !Number.isFinite(p) || p < 0 || p > 1) {
        error.textContent = "p must be between 0 and 1.";
        clearResults();
        return;
      }

      error.textContent = "";

      const mean = n * p;
      const variance = n * p * (1 - p);
      const standardDeviation = Math.sqrt(variance);
      const secondMoment = variance + mean * mean;

      // Skewness is undefined when variance is zero.
      const skewness = variance === 0
        ? null
        : (1 - 2 * p) / standardDeviation;

      document.getElementById("mean").textContent =
        mean.toFixed(4);

      document.getElementById("variance").textContent =
        variance.toFixed(4);

      document.getElementById("sd").textContent =
        standardDeviation.toFixed(4);

      document.getElementById("secondMoment").textContent =
        secondMoment.toFixed(4);

      document.getElementById("skewness").textContent =
        skewness === null ? "Undefined" : skewness.toFixed(4);
    }

    function clearResults() {
      ["mean", "variance", "sd", "secondMoment", "skewness"]
        .forEach(function(id) {
          document.getElementById(id).textContent = "—";
        });
    }

    document.getElementById("n").addEventListener(
      "input", calculateStatistics
    );

    document.getElementById("p").addEventListener(
      "input", calculateStatistics
    );

    // Calculate the default values when the page opens.
    calculateStatistics();
  </script>
</body>
</html>
