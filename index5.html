
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Binomial PMF Graph</title>

  <!-- Chart.js for the bar chart -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <!-- Plugin for drawing the mean reference line -->
  <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-annotation@3.1.0/dist/chartjs-plugin-annotation.min.js"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f6f9;
      color: #222;
      padding: 25px;
    }

    .container {
      max-width: 900px;
      margin: 20px auto;
      background: white;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 3px 12px #00000018;
    }

    h1, h2 {
      color: #234779;
    }

    .inputs {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 18px;
    }

    label {
      display: block;
      font-weight: bold;
      margin-bottom: 7px;
    }

    input {
      width: 100%;
      box-sizing: border-box;
      padding: 11px;
      font-size: 16px;
      border: 1px solid #aaa;
      border-radius: 6px;
    }

    .chart-container {
      position: relative;
      height: 430px;
      margin-top: 25px;
    }

    .info {
      background: #eef3fb;
      padding: 15px;
      border-radius: 8px;
      margin-top: 20px;
    }

    #error {
      color: #b3261e;
      font-weight: bold;
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>Binomial PMF Graph</h1>

    <p>
      Explore the probability of getting each possible number of successes
      in a binomial distribution.
    </p>

    <div class="inputs">
      <div>
        <label for="n">Number of trials (n)</label>
        <input type="number" id="n" min="1" max="500"
               step="1" value="20">
      </div>

      <div>
        <label for="p">Probability of success (p)</label>
        <input type="number" id="p" min="0" max="1"
               step="any" value="0.35">
      </div>
    </div>

    <p id="error" role="alert"></p>

    <div class="info">
      <strong>Mean (np): </strong>
      <span id="meanValue">7</span>
      <br>
      <small>The dashed vertical line marks the mean.</small>
    </div>

    <h2>Probability Mass Function</h2>

    <div class="chart-container">
      <canvas id="pmfChart"></canvas>
    </div>
  </div>

  <script>
    const nInput = document.getElementById("n");
    const pInput = document.getElementById("p");
    const errorOutput = document.getElementById("error");
    const meanOutput = document.getElementById("meanValue");

    let pmfChart = null;

    // Calculate binomial probabilities from P(X = 0) onward.
    function getBinomialPMF(n, p) {
      const probabilities = new Array(n + 1).fill(0);

      if (p === 0) {
        probabilities[0] = 1;
        return probabilities;
      }

      if (p === 1) {
        probabilities[n] = 1;
        return probabilities;
      }

      // Start at the mode to avoid underflow in the initial probability.
      const mode = Math.floor((n + 1) * p);
      probabilities[mode] = 1;

      for (let k = mode; k > 0; k--) {
        probabilities[k - 1] =
          probabilities[k] * k / (n - k + 1) * (1 - p) / p;
      }

      for (let k = mode; k < n; k++) {
        probabilities[k + 1] =
          probabilities[k] * (n - k) / (k + 1) * p / (1 - p);
      }

      // Normalize to remove small floating-point rounding errors.
      const total = probabilities.reduce((sum, value) => sum + value, 0);

      return probabilities.map(value => value / total);
    }

    function updateChart() {
      const nText = nInput.value.trim();
      const pText = pInput.value.trim();
      const n = Number(nText);
      const p = Number(pText);

      if (
        nText === "" ||
        !Number.isInteger(n) ||
        n < 1 ||
        n > 500
      ) {
        errorOutput.textContent =
          "Enter a positive integer n between 1 and 500.";
        return;
      }

      if (
        pText === "" ||
        !Number.isFinite(p) ||
        p < 0 ||
        p > 1
      ) {
        errorOutput.textContent =
          "Enter a probability p between 0 and 1.";
        return;
      }

      errorOutput.textContent = "";

      const mean = n * p;
      const xValues = Array.from({ length: n + 1 }, (_, k) => k);
      const probabilities = getBinomialPMF(n, p);

      meanOutput.textContent = mean.toFixed(4);

      if (pmfChart) {
        pmfChart.destroy();
      }

      pmfChart = new Chart(
        document.getElementById("pmfChart"),
        {
          type: "bar",

          data: {
            labels: xValues,
            datasets: [{
              label: "P(X = k)",
              data: probabilities,
              backgroundColor: "rgba(54, 112, 201, 0.75)",
              borderColor: "rgb(36, 87, 167)",
              borderWidth: 1,
              categoryPercentage: 0.9,
              barPercentage: 1
            }]
          },

          options: {
            responsive: true,
            maintainAspectRatio: false,

            interaction: {
              mode: "nearest",
              intersect: true
            },

            plugins: {
              legend: {
                display: false
              },

              tooltip: {
                callbacks: {
                  title: function(items) {
                    return "X = " + items[0].label;
                  },

                  label: function(context) {
                    return "P(X = " + context.label + ") = " +
                      context.parsed.y.toFixed(6);
                  }
                }
              },

              annotation: {
                annotations: {
                  meanLine: {
                    type: "line",
                    xMin: mean,
                    xMax: mean,
                    borderColor: "#d62828",
                    borderWidth: 2,
                    borderDash: [6, 6],
                    label: {
                      display: true,
                      content: "Mean = " + mean.toFixed(2),
                      position: "start"
                    }
                  }
                }
              }
            },

            scales: {
              x: {
                type: "category",
                title: {
                  display: true,
                  text: "Number of successes X"
                },
                ticks: {
                  autoSkip: true,
                  maxTicksLimit: 25
                }
              },

              y: {
                beginAtZero: true,
                title: {
                  display: true,
                  text: "Probability P(X)"
                },
                ticks: {
                  callback: function(value) {
                    return Number(value).toFixed(3);
                  }
                }
              }
            }
          }
        }
      );
    }

    nInput.addEventListener("input", updateChart);
    pInput.addEventListener("input", updateChart);

    updateChart();
  </script>
</body>
</html>
