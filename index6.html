```html
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Binomial Distribution Lab</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
body {
    font-family: Arial, sans-serif;
    background: #f0f4f8;
    margin: 0;
    padding: 20px;
}
.container {
    max-width: 900px;
    margin: auto;
    background: white;
    padding: 25px;
    border-radius: 12px;
    box-shadow: 0 4px 15px #0002;
}
h1, h2 { color: #174ea6; }
.input-group { margin: 15px 0; }
label { font-weight: bold; }
input {
    padding: 9px;
    width: 100%;
    max-width: 250px;
    margin-top: 6px;
    box-sizing: border-box;
}
button {
    background: #174ea6;
    color: white;
    border: none;
    padding: 11px 20px;
    border-radius: 6px;
    cursor: pointer;
}
button:hover { background: #103b80; }
.results {
    background: #eaf2ff;
    padding: 15px;
    border-radius: 8px;
    margin-top: 20px;
    line-height: 1.9;
}
canvas { margin-top: 20px; }
.inference {
    background: #e8f5e9;
    padding: 15px;
    border-radius: 8px;
    margin-top: 20px;
}
</style>
</head>
<body>
<div class="container">
<h1>Binomial Distribution</h1>
<p>Calculate probabilities for a binomial random variable.</p>

<div class="input-group">
<label for="n">Number of trials (n):</label><br>
<input type="number" id="n" value="15" min="1" max="200" step="1">
</div>

<div class="input-group">
<label for="p">Probability of success (p):</label><br>
<input type="number" id="p" value="0.6" min="0" max="1" step="0.01">
</div>

<button onclick="calculate()">Calculate Distribution</button>

<div class="results" id="results"></div>

<h2>Probability Mass Function (PMF)</h2>
<canvas id="pmfChart"></canvas>

<div class="inference" id="inference"></div>
</div>

<script>
let chart;

function combination(n, k) {
    if (k < 0 || k > n) return 0;
    k = Math.min(k, n-k);
    let result = 1;
    for (let i = 1; i <= k; i++) {
        result = result * (n-k+i) / i;
    }
    return result;
}

function binomialPMF(n, p, x) {
    if (p === 0) return x === 0 ? 1 : 0;
    if (p === 1) return x === n ? 1 : 0;
    return combination(n, x) *
           Math.pow(p, x) * Math.pow(1-p, n-x);
}

function calculate() {
    const n = Number(document.getElementById("n").value);
    const p = Number(document.getElementById("p").value);

    if (!Number.isInteger(n) || n < 1 || n > 200 ||
        !Number.isFinite(p) || p < 0 || p > 1) {
        alert("Enter an integer n from 1 to 200 and p between 0 and 1.");
        return;
    }

    const mean = n * p;
    const variance = n * p * (1-p);
    const p9 = n >= 9 ? binomialPMF(n, p, 9) : 0;

    let pAtMost10 = 0;
    for (let x = 0; x <= Math.min(10, n); x++) {
        pAtMost10 += binomialPMF(n, p, x);
    }

    document.getElementById("results").innerHTML = `
        <h2>Results</h2>
        Mean = np = <b>${mean.toFixed(4)}</b><br>
        Variance = np(1-p) = <b>${variance.toFixed(4)}</b><br>
        P(X = 9) = <b>${p9.toFixed(6)}</b>
        (${(p9*100).toFixed(2)}%)<br>
        P(X &le; 10) = <b>${pAtMost10.toFixed(6)}</b>
        (${(pAtMost10*100).toFixed(2)}%)
    `;

    const labels = Array.from({length: n+1}, (_, i) => i);
    const values = labels.map(x => binomialPMF(n, p, x));
    const peak = Math.max(...values);
    const peakX = values.indexOf(peak);

    if (chart) chart.destroy();
    chart = new Chart(document.getElementById("pmfChart"), {
        type: "bar",
        data: {
            labels: labels,
            datasets: [{
                label: "P(X = x)",
                data: values,
                backgroundColor: "#4285f4",
                borderColor: "#174ea6",
                borderWidth: 1
            }]
        },
        options: {
            responsive: true,
            scales: {
                x: { title: { display: true, text: "Number of successes (x)" } },
                y: {
                    beginAtZero: true,
                    title: { display: true, text: "Probability" }
                }
            }
        }
    });

    document.getElementById("inference").innerHTML =
        `<h2>Inference</h2>
        The highest probability occurs at x = <b>${peakX}</b>.
        The expected number of successes is ${mean.toFixed(2)}.
        The probability of at most 10 successes is
        ${(pAtMost10*100).toFixed(2)}%.`;
}

calculate();
</script>
</body>
</html>
