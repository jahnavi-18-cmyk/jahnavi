
<div class="panel">
  <h2>Binomial PMF Calculator</h2>

  <p>
    Calculate the probability of getting exactly k successes
    in n independent trials.
  </p>

  <div class="inputs">
    <div>
      <label for="k">Number of successes (k)</label>
      <input
        id="k"
        type="number"
        min="0"
        step="1"
        value="7"
      />
    </div>
  </div>

  <p>
    <strong>Mathematical expression:</strong>
  </p>

  <p class="selected">
    P(X = k) = C(n, k) p<sup>k</sup> (1 − p)<sup>n−k</sup>
  </p>

  <h3>Calculated Probability</h3>
  <div class="metric">
    <div class="value" id="pmfResult">—</div>
    <div id="pmfExplanation">
      Enter valid parameters to calculate the probability.
    </div>
  </div>

  <p id="pmfStatus" class="status"></p>
</div>
