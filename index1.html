
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Binomial Distribution</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f6f9;
      color: #222;
      margin: 0;
      padding: 30px 15px;
    }

    .container {
      max-width: 650px;
      margin: auto;
      padding: 25px;
      background: white;
      border-radius: 12px;
      box-shadow: 0 3px 12px #00000018;
    }

    h1 {
      color: #234779;
    }

    label {
      display: block;
      margin-top: 18px;
      margin-bottom: 8px;
      font-weight: bold;
    }

    input {
      width: 100%;
      box-sizing: border-box;
      padding: 12px;
      border: 1px solid #aaa;
      border-radius: 6px;
      font-size: 16px;
    }

    .selected-values {
      margin-top: 24px;
      padding: 18px;
      background: #eef3fb;
      border-radius: 8px;
    }

    .selected-values p {
      font-size: 18px;
      margin: 10px 0;
    }

    #error {
      color: #b3261e;
      font-weight: bold;
      margin-top: 15px;
    }

    .hint {
      color: #555;
      font-size: 14px;
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>Binomial Distribution</h1>

    <p>
      Set the number of trials and the probability of success.
    </p>

    <label for="n">Number of trials (n)</label>
    <input
      type="number"
      id="n"
      min="1"
      step="1"
      value="20"
    >
    <p class="hint">Enter a positive integer.</p>

    <label for="p">Probability of success (p)</label>
    <input
      type="number"
      id="p"
      min="0"
      max="1"
      step="any"
      value="0.35"
    >
    <p class="hint">Enter a value between 0 and 1, inclusive.</p>

    <p id="error" role="alert"></p>

    <div class="selected-values" aria-live="polite">
      <h2>Selected Values</h2>
      <p>Number of trials: <strong id="displayN">20</strong></p>
      <p>Probability of success: <strong id="displayP">0.35</strong></p>
      <p id="distribution">X ~ Binomial(20, 0.35)</p>
    </div>
  </div>

  <script>
    const nInput = document.getElementById("n");
    const pInput = document.getElementById("p");

    function validateInputs() {
      const nText = nInput.value.trim();
      const pText = pInput.value.trim();

      const n = Number(nText);
      const p = Number(pText);

      const error = document.getElementById("error");

      if (nText === "" || !Number.isInteger(n) || n <= 0) {
        error.textContent =
          "Invalid input: n must be a positive integer.";
        return;
      }

      if (
        pText === "" ||
        !Number.isFinite(p) ||
        p < 0 ||
        p > 1
      ) {
        error.textContent =
          "Invalid input: p must be between 0 and 1.";
        return;
      }

      error.textContent = "";

      document.getElementById("displayN").textContent = n;
      document.getElementById("displayP").textContent = p;
      document.getElementById("distribution").textContent =
        "X ~ Binomial(" + n + ", " + p + ")";
    }

    nInput.addEventListener("input", validateInputs);
    pInput.addEventListener("input", validateInputs);

    // Display the default values on page load.
    validateInputs();
  </script>
</body>
</html>
